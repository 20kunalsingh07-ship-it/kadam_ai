<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kadam AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap">
<script>try{var s=JSON.parse(localStorage.getItem('kadam-ai-v1'));document.documentElement.classList.toggle('dark',s&&s.theme?s.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){}</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;background:#f8fafc;color:#0f172a}
.dark body{background:#0b1020;color:#e2e8f0}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet{animation:up .3s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease-out}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}50%{box-shadow:0 0 44px 4px rgba(99,102,241,.35)}}
.glow{animation:glow 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.glow,.sheet,.pop{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="env,react">
const {useState,useEffect,useRef}=React;
const KEY='kadam-ai-v1';
const ci=(x,y,r)=>`M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`;
const P={
 home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
 map:'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14',
 timer:ci(12,13,8)+'M12 9v4l2 2M9 2h6',
 users:ci(9,8,3.5)+'M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2.2.7 3.5 2.6 3.5 5.5',
 user:ci(12,8,4)+'M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7',
 sun:ci(12,12,4)+'M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
 moon:'M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z',
 spark:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z',
 check:'M5 12.5l4.5 4.5L19 7.5',
 flame:'M12 22c4 0 7-2.8 7-7 0-3-2-5-3-7-1 1.5-2 2-3 2 0-3-1-5-3-7-1 4-5 6-5 12 0 4 3 7 7 7z',
 play:'M7 4.5v15l12-7.5z',
 pause:'M8 5v14M16 5v14',
 reset:'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5',
 send:'M22 2 11 13M22 2l-7 20-4-9-9-4z',
 x:'M18 6 6 18M6 6l12 12',
 cal:'M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 2v4M16 2v4M3 10h18',
 vol:'M11 5 6 9H2v6h4l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12',
 mute:'M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6',
 chev:'m6 9 6 6 6-6'
};
const I=({n,s=20,c=''})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d={P[n]}/></svg>;
const CARD='rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900';
const MUTED='text-slate-500 dark:text-slate-400';
const PRI={high:'bg-rose-500/10 text-rose-500',med:'bg-amber-500/10 text-amber-500',low:'bg-sky-500/10 text-sky-500'};
const Tag=({c,children})=><span className={'rounded-md px-1.5 py-0.5 text-[10px] font-semibold '+c}>{children}</span>;
const Bar=({p,h=6,c='bg-emerald-500',t='bg-slate-200 dark:bg-slate-800'})=><div className={'overflow-hidden rounded-full '+t} style={{height:h}}><div className={'h-full rounded-full transition-all duration-500 '+c} style={{width:Math.round(p*100)+'%'}}/></div>;
const Ring=({p,size=104,sw=10,col='#10b981',children})=>{const r=(size-sw)/2,c=2*Math.PI*r;return <div className="relative grid shrink-0 place-items-center" style={{width:size,height:size}}><svg width={size} height={size} className="-rotate-90"><circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={sw} className="stroke-slate-500/20"/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={sw} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-Math.min(1,Math.max(0,p)))} style={{transition:'stroke-dashoffset .6s ease'}}/></svg><div className="absolute text-center">{children}</div></div>};

/* ---------- AI layer: live calls go to /api (your server holds the keys); the mock below is the fallback ---------- */
const PH=[
 ['Foundation',['Basics & terminology','Study system & tools','Core vocabulary'],['Learn','Take notes on']],
 ['Core Skills',['Key concepts','Problem patterns','Essential tools'],['Deep-dive into','Solve exercises on']],
 ['Practice & Apply',['Timed drills','A mini project','Error-log review'],['Practise','Build with']],
 ['Mastery',['Mock runs','Weak-spot repair','Final polish'],['Simulate','Fix gaps in']]
];
function buildPlan({goal,months,hours}){
 const W=months*4,weeks=[],tasks=[],sp=[.45,.35,.2];
 for(let w=0;w<W;w++){
  const p=Math.min(3,Math.floor(w*4/W)),[pn,th,vb]=PH[p],t=th[w%3];
  weeks.push({w,p,pn,title:`Master ${t.toLowerCase()} for ${goal}`});
  for(let d=0;d<7;d++){const day=w*7+d;
   [`${vb[0]} ${t.toLowerCase()}`,`${vb[1]} ${t.toLowerCase()}`,d%2?'Recap in 5 lines':'Review gaps & plan tomorrow'].forEach((title,k)=>tasks.push({id:day+'-'+k,day,title,mins:Math.max(10,Math.round(hours*60*sp[k]/5)*5),pri:['high','med','low'][k],done:false}));}
 }
 return {weeks,tasks};
}
function moveTasks({tasks,today,last}){
 const end=(Math.floor(today/7)+1)*7-1,to=[];
 for(let d=today+1;d<=Math.min(last,end);d++)to.push(d);
 if(!to.length)for(let d=today+1;d<=Math.min(last,today+3);d++)to.push(d);
 if(!to.length)return {tasks,moved:0,days:0};
 const rk={high:0,med:1,low:2},m={};
 tasks.filter(t=>!t.done&&t.day<=today).sort((a,b)=>rk[a.pri]-rk[b.pri]).forEach((t,i)=>m[t.id]=to[i%to.length]);
 const n=Object.keys(m).length;
 return {tasks:tasks.map(t=>m[t.id]!=null?{...t,day:m[t.id],moved:true}:t),moved:n,days:to.length};
}
function reply({text,goal,task,milestone,streak}){
 const m=text.toLowerCase();
 if(/explain|what is|how do|concept/.test(m))return `Let's unpack "${task}": (1) skim the big picture for 5 minutes, (2) learn one core idea and write it in your own words, (3) quiz yourself with two quick questions. Want a mini practice set on it?`;
 if(/tip|study|focus|learn/.test(m))return 'Work in 25/5 blocks, keep your phone out of reach, and start with the hardest task while your energy is high. Active recall beats re-reading: close the notes and test yourself.';
 if(/motiv|tired|lazy|bored|stuck/.test(m))return `Try the 5-minute rule: commit to just 5 minutes of "${task}". Momentum usually does the rest.${streak?` You're on a ${streak}-day streak, so protect it!`:' Today can be day one of a streak.'}`;
 if(/week|milestone|plan|roadmap|schedule/.test(m))return `This week's milestone: ${milestone}. Finish the high-priority tasks first. Short on time? Tap "I'm busy today" on the dashboard and I'll rebalance your week.`;
 return `Good question about ${goal}. This is a mock reply. Connect an OpenAI or Gemini proxy in the API module for full, personalised answers. Meanwhile: shrink it to the smallest next step and do that first.`;
}
const lag=(ms,f)=>new Promise(r=>setTimeout(()=>r(f()),ms));
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:AbortSignal.timeout?AbortSignal.timeout(45000):undefined}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const merge=(i,ai)=>{const p=buildPlan(i);ai.weeks.forEach((w,wi)=>{const wk=p.weeks[wi];if(!wk)return;if(w.title)wk.title=w.title;(w.days||[]).forEach((t,d)=>{const x=p.tasks[(wi*7+d)*3];if(t&&x&&d<7)x.title=t})});return p};
const fb=(n,ms,f)=>e=>{console.warn('Kadam AI: /api/'+n+' failed, using mock ('+(e&&e.message)+')');return lag(ms,f)};
const API={
 generatePlan:i=>post('/api/plan',i).then(d=>merge(i,d)).catch(fb('plan',1500,()=>buildPlan(i))),
 reschedule:i=>lag(900,()=>moveTasks(i)),
 chat:i=>post('/api/chat',i).then(d=>d.reply||reply(i)).catch(fb('chat',900,()=>reply(i)))
};

function calcStreak(tasks,today){
 const by={};tasks.forEach(t=>{const b=by[t.day]||(by[t.day]=[0,0]);b[1]++;if(t.done)b[0]++});
 const ok=d=>by[d]&&by[d][0]===by[d][1];
 let s=0,d=ok(today)?today:today-1;
 while(d>=0&&ok(d)){s++;d--}
 return s;
}
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const INIT={theme:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light',tasks:null,weeks:[],goal:'',months:3,hours:2,start:0,shift:0,focusMins:0,sessions:0,feed:[],cheers:{},ai:{prov:'Mock AI',key:''},chat:[{r:'ai',t:"Namaste! I'm your Kadam Co-Pilot. Ask me to explain a concept, plan your day, or get you moving."}]};

function useAmbient(play){
 const r=useRef(null);
 useEffect(()=>{
  if(!play){if(r.current)r.current.g.gain.setTargetAtTime(0,r.current.c.currentTime,.3);return}
  if(!r.current){try{
   const c=new (window.AudioContext||window.webkitAudioContext)(),n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;
   for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
   const s=c.createBufferSource();s.buffer=b;s.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=600;
   const g=c.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(c.destination);s.start();r.current={c,g};
  }catch(e){return}}
  r.current.c.resume();r.current.g.gain.setTargetAtTime(.5,r.current.c.currentTime,.3);
 },[play]);
}

function Onboard({set}){
 const [g,setG]=useState(''),[m,setM]=useState(3),[h,setH]=useState(2),[ld,setLd]=useState(false),[si,setSi]=useState(0);
 const steps=['Analysing your goal…','Structuring phases…','Splitting into weekly milestones…','Scheduling daily micro-tasks…'];
 const go=()=>{if(!g.trim())return;setLd(true);const iv=setInterval(()=>setSi(x=>Math.min(3,x+1)),650);
  API.generatePlan({goal:g.trim(),months:m,hours:h}).then(p=>{clearInterval(iv);set({...p,goal:g.trim(),months:m,hours:h,start:new Date().setHours(0,0,0,0),shift:0})})};
 return <div className="mx-auto flex min-h-screen max-w-lg flex-col justify-center gap-6 px-5 py-8">
  <div className="flex items-center gap-3"><div className="grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-500 text-white"><I n="spark" s={24}/></div><div><div className="text-2xl font-bold">Kadam AI</div><div className={'text-sm '+MUTED}>One small step (kadam) at a time.</div></div></div>
  {ld?<div className={CARD+' py-10 text-center'}><div className="mx-auto h-14 w-14 animate-spin rounded-full border-4 border-indigo-500/20 border-t-indigo-500"/><div className="mt-5 font-semibold text-indigo-500">{steps[si]}</div><div className={'mt-1 text-xs '+MUTED}>Building {m*4} weeks of milestones for “{g}”</div></div>
  :<div className="space-y-5">
   <div><label className="mb-2 block text-sm font-semibold">What's your big goal?</label>
    <input value={g} onChange={e=>setG(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} placeholder="e.g. Crack SSC CGL" className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-800 dark:bg-slate-900"/>
    <div className="mt-2 flex flex-wrap gap-2">{['Crack SSC CGL','Learn Jetpack Compose','Launch a small business'].map(x=><button key={x} onClick={()=>setG(x)} className="rounded-full bg-indigo-500/10 px-3 py-1 text-xs font-medium text-indigo-500">{x}</button>)}</div></div>
   <div><div className="mb-2 text-sm font-semibold">Timeline</div><div className="grid grid-cols-4 gap-2">{[1,2,3,6].map(x=><button key={x} onClick={()=>setM(x)} className={'rounded-xl border py-2.5 text-sm font-semibold '+(m===x?'border-indigo-500 bg-indigo-500 text-white':'border-slate-200 dark:border-slate-800')}>{x} mo</button>)}</div></div>
   <div><div className="mb-2 flex justify-between text-sm font-semibold"><span>Daily time available</span><span className="text-indigo-500">{h} h/day</span></div><input type="range" min="1" max="8" step="0.5" value={h} onChange={e=>setH(+e.target.value)} className="w-full accent-indigo-500"/></div>
   <button onClick={go} disabled={!g.trim()} className="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-500 to-violet-500 py-3.5 font-semibold text-white shadow-lg shadow-indigo-500/25 disabled:opacity-40"><I n="spark" s={18}/>Generate my roadmap</button>
  </div>}
 </div>;
}

function Dash({st,tl,dn,streak,today,total,wk,toggle,busy,resched,startFocus}){
 const p=tl.length?dn/tl.length:0;
 return <div className="space-y-4">
  <div className="rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 p-4 text-white shadow-lg shadow-indigo-500/20">
   <div className="flex items-center gap-2 text-xs font-medium text-indigo-100"><I n="spark" s={14}/>AI plan: week {wk.w+1}, {wk.pn} (day {today+1} of {total})</div>
   <div className="mt-1 text-lg font-semibold leading-snug">{wk.title}</div>
  </div>
  <div className={CARD+' flex items-center gap-4'}>
   <Ring p={p}><div className="text-2xl font-bold">{dn}/{tl.length}</div><div className={'text-[10px] '+MUTED}>done today</div></Ring>
   <div className="flex-1 space-y-2">
    <div className="flex items-center gap-2 rounded-xl bg-orange-500/10 px-3 py-2 text-orange-500"><I n="flame" s={22}/><div><div className="text-lg font-bold leading-none">{streak} day{streak===1?'':'s'}</div><div className="text-[10px] opacity-80">current streak</div></div></div>
    <div className={'text-xs '+MUTED}>{tl.length&&p===1?'Every task done. Superb! 🎉':`${st.hours} h planned for today`}</div>
   </div>
  </div>
  <div className="flex items-center justify-between"><h2 className="font-semibold">Today's Micro-Tasks</h2>
   <button onClick={resched} disabled={busy||!tl.some(t=>!t.done)} className="flex items-center gap-1.5 rounded-full bg-indigo-500/10 px-3 py-1.5 text-xs font-semibold text-indigo-500 disabled:opacity-40"><I n="cal" s={14}/>{busy?'AI is rebalancing…':"I'm busy today"}</button></div>
  <div className="space-y-2">
   {tl.length?tl.map(t=><div key={t.id} className={CARD+' flex items-center gap-3 !p-3 transition '+(t.done?'!border-emerald-500/40':'')}>
    <button aria-label="Mark done" onClick={()=>toggle(t.id)} className={'grid h-6 w-6 shrink-0 place-items-center rounded-full border-2 '+(t.done?'pop border-emerald-500 bg-emerald-500 text-white':'border-slate-300 dark:border-slate-600')}>{t.done&&<I n="check" s={14}/>}</button>
    <div className="min-w-0 flex-1"><div className={'truncate text-sm font-medium '+(t.done?'text-slate-400 line-through':'')}>{t.title}</div>
     <div className="mt-1 flex flex-wrap items-center gap-1.5"><Tag c={PRI[t.pri]}>{t.pri}</Tag><span className={'text-[11px] '+MUTED}>{t.mins} min</span>{t.moved&&<Tag c="bg-violet-500/10 text-violet-500">AI rescheduled</Tag>}{t.day<today&&<Tag c="bg-slate-500/10 text-slate-500">carried over</Tag>}</div></div>
    {!t.done&&<button aria-label="Start focus" onClick={()=>startFocus(t.id)} className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-indigo-500/10 text-indigo-500"><I n="play" s={14}/></button>}
   </div>):<div className={CARD+' text-center text-sm '+MUTED}>Nothing scheduled today. Enjoy the breather.</div>}
  </div>
 </div>;
}

function Road({st,today}){
 const [open,setOpen]=useState(null),cw=Math.floor(today/7);
 const bw=st.weeks.map(()=>[0,0]);st.tasks.forEach(t=>{const b=bw[Math.floor(t.day/7)];if(b){b[1]++;if(t.done)b[0]++}});
 const all=st.tasks.length,dd=st.tasks.filter(t=>t.done).length;
 return <div className="space-y-4">
  <div className={CARD+' space-y-2'}><div className="flex justify-between text-sm"><span className="font-semibold">Roadmap for {st.goal}</span><span className="font-semibold text-emerald-500">{Math.round(dd/all*100)}%</span></div><Bar p={dd/all}/><div className={'text-xs '+MUTED}>{st.weeks.length} weeks, {all} micro-tasks, {st.hours} h/day</div></div>
  {PH.map((ph,pi)=>{const ws=st.weeks.filter(w=>w.p===pi);if(!ws.length)return null;
   return <div key={pi} className="space-y-2">
    <div className="flex items-center justify-between pt-1"><div className="text-sm font-bold text-violet-500">Phase {pi+1}: {ph[0]}</div><div className={'text-[11px] '+MUTED}>Weeks {ws[0].w+1} to {ws[ws.length-1].w+1}</div></div>
    {ws.map(w=>{const [d,n]=bw[w.w],full=n>0&&d===n,cur=w.w===cw;
     return <div key={w.w} className={CARD+' !p-3 '+(cur?'!border-indigo-500':'')}>
      <button className="flex w-full items-center gap-3 text-left" onClick={()=>setOpen(open===w.w?null:w.w)}>
       <div className={'grid h-9 w-9 shrink-0 place-items-center rounded-xl text-xs font-bold '+(full?'bg-emerald-500 text-white':cur?'bg-indigo-500 text-white':'bg-slate-100 dark:bg-slate-800')}>{full?<I n="check" s={16}/>:w.w+1}</div>
       <div className="min-w-0 flex-1"><div className="truncate text-sm font-medium">{w.title}</div><div className="mt-1.5"><Bar p={n?d/n:0} h={4}/></div></div>
       <I n="chev" s={16} c={'shrink-0 text-slate-400 transition '+(open===w.w?'rotate-180':'')}/>
      </button>
      {open===w.w&&<div className="mt-3 space-y-1.5 border-t border-slate-100 pt-3 dark:border-slate-800">{st.tasks.filter(t=>Math.floor(t.day/7)===w.w).map(t=><div key={t.id} className="flex items-center gap-2 text-xs"><span className={t.done?'text-emerald-500':'text-slate-300 dark:text-slate-600'}>●</span><span className={'w-8 shrink-0 '+MUTED}>D{t.day+1}</span><span className={t.done?'line-through opacity-50':''}>{t.title}</span></div>)}</div>}
     </div>})}
   </div>})}
 </div>;
}

function Focus({tl,ft,setFid,tm,setTm,amb,setAmb,toggle,say}){
 const f=tm.mode==='focus',tot=f?1500:300,on=tm.run&&f,pend=tl.filter(t=>!t.done);
 const mm=String(Math.floor(tm.left/60)).padStart(2,'0'),ss=String(tm.left%60).padStart(2,'0');
 const sw=m=>setTm({mode:m,left:m==='focus'?1500:300,run:false});
 return <div className="space-y-4">
  <div className={CARD+' text-center transition-all duration-700 '+(on?'glow !border-indigo-500/50 !bg-indigo-950 text-white':'')}>
   <div className="mx-auto mb-4 flex w-fit rounded-full bg-slate-500/10 p-1 text-xs font-semibold">{[['focus','Focus 25'],['break','Break 5']].map(([k,l])=><button key={k} onClick={()=>sw(k)} className={'rounded-full px-4 py-1.5 '+(tm.mode===k?(k==='focus'?'bg-indigo-500 text-white':'bg-emerald-500 text-white'):'text-slate-400')}>{l}</button>)}</div>
   <div className="flex justify-center"><Ring p={1-tm.left/tot} size={220} sw={12} col={f?'#6366f1':'#10b981'}><div className="text-5xl font-bold tabular-nums">{mm}:{ss}</div><div className={'mt-1 text-xs '+(on?'text-indigo-200':MUTED)}>{f?(on?'Deep focus. Stay with it.':'Ready when you are'):'Recharge'}</div></Ring></div>
   <div className="mt-3 text-sm">{ft?<>Working on: <b>{ft.title}</b></>:'All of today’s tasks are done 🎉'}</div>
   <div className="mt-4 flex items-center justify-center gap-3">
    <button onClick={()=>setTm(t=>({...t,run:!t.run}))} className={'flex items-center gap-2 rounded-full px-7 py-3 font-semibold text-white shadow-lg '+(f?'bg-indigo-500 shadow-indigo-500/30':'bg-emerald-500 shadow-emerald-500/30')}><I n={tm.run?'pause':'play'} s={18}/>{tm.run?'Pause':'Start'}</button>
    <button aria-label="Reset timer" onClick={()=>sw(tm.mode)} className="grid h-12 w-12 place-items-center rounded-full bg-slate-500/10"><I n="reset"/></button>
    <button aria-label="Ambient sound" onClick={()=>{setAmb(!amb);say(amb?'Ambient sound off':'Soft ambient noise plays while you focus')}} className={'grid h-12 w-12 place-items-center rounded-full '+(amb?'bg-violet-500 text-white':'bg-slate-500/10')}><I n={amb?'vol':'mute'}/></button>
   </div>
   <button onClick={()=>setTm(t=>({...t,left:3,run:true}))} className="mt-3 text-[11px] text-slate-400 underline">Demo: jump to the last 3 seconds</button>
  </div>
  <div className={CARD}><div className="mb-2 text-sm font-semibold">Linked task</div>
   <div className="space-y-1.5">{pend.length?pend.map(t=><button key={t.id} onClick={()=>setFid(t.id)} className={'flex w-full items-center justify-between rounded-xl border px-3 py-2 text-left text-sm '+(ft&&ft.id===t.id?'border-indigo-500 bg-indigo-500/10':'border-slate-200 dark:border-slate-800')}><span className="truncate">{t.title}</span><span className={'ml-2 shrink-0 text-[11px] '+MUTED}>{t.mins} min</span></button>):<div className={'text-sm '+MUTED}>No pending tasks. Nice work.</div>}</div>
   {ft&&<button onClick={()=>{toggle(ft.id);say('Task completed ✅')}} className="mt-3 w-full rounded-xl bg-emerald-500 py-2.5 text-sm font-semibold text-white">Mark task done</button>}
  </div>
 </div>;
}

const PEERS=[['Aarav',3,3,21],['Meera',2,3,9],['Rohan',3,3,14],['Sana',1,3,5]];
const POSTS=[{id:'a',who:'Aarav',t:'12m',txt:'Finished all 3 tasks and logged my errors. Small steps add up.',n:4},{id:'b',who:'Rohan',t:'1h',txt:'Three 25-minute sprints today. The timer trick works.',n:6},{id:'c',who:'Meera',t:'3h',txt:'Used “I’m busy today” and got a stress-free evening.',n:2}];
const COL=['from-indigo-500 to-violet-500','from-rose-500 to-orange-400','from-sky-500 to-cyan-400','from-amber-500 to-yellow-400','from-fuchsia-500 to-pink-400'];
const Av=({n,i})=><div className={'grid h-9 w-9 shrink-0 place-items-center rounded-full bg-gradient-to-br text-sm font-bold text-white '+COL[i%5]}>{n[0]}</div>;
function Pod({st,set,say,dn,tl,streak}){
 const all=[['You',dn,tl.length||3,streak],...PEERS],td=all.reduce((s,m)=>s+m[1],0),tt=all.reduce((s,m)=>s+m[2],0);
 const feed=[...st.feed,...POSTS];
 const share=()=>{set(s=>({feed:[{id:'m'+Date.now(),who:'You',t:'now',txt:`Completed ${dn}/${tl.length} tasks today ${dn&&dn===tl.length?'🔥':'💪'}`,n:0},...s.feed]}));say('Check-in shared with your pod')};
 const cheer=id=>set(s=>({cheers:{...s.cheers,[id]:!s.cheers[id]}}));
 return <div className="space-y-4">
  <div className="space-y-2 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 p-4 text-white"><div className="text-sm text-indigo-100">Your accountability pod</div><div className="text-lg font-semibold">5 learners with goals like yours</div><Bar p={td/tt} c="bg-emerald-400" t="bg-white/25"/><div className="text-xs text-indigo-100">{td} of {tt} tasks done today as a pod</div></div>
  <div className={CARD+' divide-y divide-slate-100 !p-0 dark:divide-slate-800'}>{all.map((m,i)=>{const ok=m[1]===m[2]&&m[2]>0;return <div key={m[0]} className="flex items-center gap-3 p-3"><Av n={m[0]} i={i}/><div className="min-w-0 flex-1"><div className="flex items-center gap-2 text-sm font-semibold">{m[0]}<span className="text-[11px] font-medium text-orange-500">🔥 {m[3]}</span></div><div className={'truncate text-xs '+MUTED}>Completed {m[1]}/{m[2]} tasks today {ok?'🔥':''}</div></div><Tag c={ok?'bg-emerald-500/10 text-emerald-500':'bg-amber-500/10 text-amber-500'}>{ok?'Done':'In progress'}</Tag></div>})}</div>
  <button onClick={share} className="w-full rounded-xl bg-indigo-500 py-3 text-sm font-semibold text-white">Share my check-in</button>
  <h2 className="font-semibold">Pod feed</h2>
  <div className="space-y-2">{feed.map(p=>{const i=all.findIndex(a=>a[0]===p.who),on=st.cheers[p.id];return <div key={p.id} className={CARD+' flex gap-3 !p-3'}><Av n={p.who} i={Math.max(0,i)}/><div className="min-w-0 flex-1"><div className="text-sm font-semibold">{p.who} <span className={'text-xs font-normal '+MUTED}>{p.t}</span></div><div className="text-sm">{p.txt}</div><button onClick={()=>cheer(p.id)} className={'mt-2 rounded-full px-2.5 py-1 text-xs font-medium '+(on?'bg-emerald-500/15 text-emerald-500':'bg-slate-500/10 '+MUTED)}>🙌 {p.n+(on?1:0)}</button></div></div>})}</div>
 </div>;
}

function Me({st,set,say,streak,done,reset}){
 return <div className="space-y-4">
  <div className={CARD+' flex items-center gap-3'}><div className="grid h-14 w-14 place-items-center rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-500 text-xl font-bold text-white">K</div><div><div className="font-semibold">Kadam Learner</div><div className={'text-xs '+MUTED}>{st.goal}</div><div className={'text-xs '+MUTED}>{st.months} month plan, {st.hours} h/day</div></div></div>
  <div className="grid grid-cols-3 gap-2">{[['🔥',streak,'Day streak'],['✅',done,'Tasks done'],['⏱',st.focusMins,'Focus min']].map(([e,v,l])=><div key={l} className={CARD+' text-center !p-3'}><div>{e}</div><div className="text-xl font-bold">{v}</div><div className={'text-[10px] '+MUTED}>{l}</div></div>)}</div>
  <div className={CARD+' flex items-center justify-between'}><div className="text-sm font-semibold">Dark mode</div><button role="switch" aria-checked={st.theme==='dark'} onClick={()=>set({theme:st.theme==='dark'?'light':'dark'})} className={'h-7 w-12 rounded-full p-1 transition '+(st.theme==='dark'?'bg-indigo-500':'bg-slate-300')}><div className={'h-5 w-5 rounded-full bg-white transition '+(st.theme==='dark'?'translate-x-5':'')}/></button></div>
  <div className={CARD+' space-y-1'}><div className="text-sm font-semibold">AI mentor</div><div className={'text-xs '+MUTED}>Answers come from your server through /api/chat and /api/plan, so no key ever reaches this page. If the server is unreachable, the built-in mock AI steps in.</div></div>
  <div className="grid grid-cols-2 gap-2"><button onClick={()=>{set({shift:st.shift+1});say('Jumped to the next day')}} className={CARD+' !p-3 text-sm font-semibold'}>Demo: next day</button><button onClick={reset} className={CARD+' !p-3 text-sm font-semibold text-rose-500'}>Reset app</button></div>
 </div>;
}

function Chat({open,onClose,msgs,send,typing}){
 const [v,setV]=useState(''),end=useRef(null);
 useEffect(()=>{if(end.current)end.current.scrollIntoView({behavior:'smooth'})},[msgs,typing,open]);
 if(!open)return null;
 const go=t=>{t=t.trim();if(!t)return;setV('');send(t)};
 return <div className="fixed inset-0 z-50 flex items-end bg-black/50" onClick={onClose}>
  <div onClick={e=>e.stopPropagation()} className="sheet mx-auto flex h-[80vh] w-full max-w-lg flex-col rounded-t-3xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
   <div className="flex items-center gap-3 border-b border-slate-100 p-4 dark:border-slate-800"><div className="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 text-white"><I n="spark" s={18}/></div><div className="flex-1"><div className="text-sm font-semibold">Kadam Co-Pilot</div><div className="text-xs text-emerald-500">Your study and action mentor</div></div><button aria-label="Close" onClick={onClose} className="grid h-8 w-8 place-items-center rounded-full bg-slate-500/10"><I n="x" s={16}/></button></div>
   <div className="flex-1 space-y-3 overflow-y-auto p-4">
    {msgs.map((m,i)=><div key={i} className={'flex '+(m.r==='me'?'justify-end':'')}><div className={'max-w-[85%] whitespace-pre-wrap rounded-2xl px-3.5 py-2.5 text-sm '+(m.r==='me'?'rounded-br-md bg-indigo-500 text-white':'rounded-bl-md bg-violet-500/10')}>{m.t}</div></div>)}
    {typing&&<div className="flex w-fit gap-1 rounded-2xl rounded-bl-md bg-violet-500/10 px-4 py-3">{[0,1,2].map(i=><span key={i} className="h-1.5 w-1.5 animate-bounce rounded-full bg-violet-500" style={{animationDelay:i*.15+'s'}}/>)}</div>}
    <div ref={end}/>
   </div>
   <div className="flex gap-2 overflow-x-auto px-4 pb-2">{["Explain today's first task",'Give me a study tip','I feel unmotivated',"What's my weekly milestone?"].map(q=><button key={q} onClick={()=>go(q)} className="shrink-0 rounded-full bg-indigo-500/10 px-3 py-1.5 text-xs font-medium text-indigo-500">{q}</button>)}</div>
   <div className="flex gap-2 px-4 pt-1" style={{paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 12px)'}}>
    <input value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go(v)} placeholder="Ask your mentor…" className="min-w-0 flex-1 rounded-xl border border-slate-200 bg-transparent px-4 py-2.5 text-sm outline-none focus:border-violet-500 dark:border-slate-700"/>
    <button aria-label="Send" onClick={()=>go(v)} className="grid h-11 w-11 place-items-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 text-white"><I n="send" s={18}/></button>
   </div>
  </div>
 </div>;
}

const TABS=[['home','Dashboard','home'],['road','Roadmap','map'],['focus','Focus','timer'],['pod','Community','users'],['me','Profile','user']];
function App(){
 const [st,setSt]=useState(()=>({...INIT,...load()}));
 const [tab,setTab]=useState('home'),[tm,setTm]=useState({mode:'focus',left:1500,run:false}),[amb,setAmb]=useState(false),[fid,setFid]=useState(null);
 const [chat,setChat]=useState(false),[typing,setTyping]=useState(false),[busy,setBusy]=useState(false),[toast,setToast]=useState('');
 const set=p=>setSt(s=>({...s,...(typeof p==='function'?p(s):p)}));
 const say=m=>{setToast(m);clearTimeout(window.__t);window.__t=setTimeout(()=>setToast(''),2800)};
 useEffect(()=>{document.documentElement.classList.toggle('dark',st.theme==='dark')},[st.theme]);
 useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}},[st]);
 useEffect(()=>{if(!tm.run)return;const i=setInterval(()=>setTm(t=>({...t,left:Math.max(0,t.left-1)})),1000);return()=>clearInterval(i)},[tm.run]);
 useEffect(()=>{
  if(!tm.run||tm.left>0)return;
  if(tm.mode==='focus'){set(s=>({focusMins:s.focusMins+25,sessions:s.sessions+1}));say('Focus session complete. Take a 5-minute break.');setTm({mode:'break',left:300,run:false})}
  else{say('Break over. Ready for another round?');setTm({mode:'focus',left:1500,run:false})}
 },[tm.left]);
 useAmbient(amb&&tm.run&&tm.mode==='focus');
 if(!st.tasks)return <Onboard set={set}/>;

 const total=st.weeks.length*7,last=total-1;
 const today=Math.min(last,Math.max(0,Math.floor((Date.now()-st.start)/864e5)+st.shift));
 const rk={high:0,med:1,low:2};
 const tl=st.tasks.filter(t=>t.day===today||(t.day<today&&!t.done)).sort((a,b)=>rk[a.pri]-rk[b.pri]);
 const dn=tl.filter(t=>t.done).length,streak=calcStreak(st.tasks,today),wk=st.weeks[Math.floor(today/7)];
 const ft=tl.find(t=>t.id===fid&&!t.done)||tl.find(t=>!t.done);
 const toggle=id=>set(s=>({tasks:s.tasks.map(t=>t.id===id?{...t,done:!t.done,day:t.day<today?today:t.day}:t)}));
 const startFocus=id=>{setFid(id);setTm({mode:'focus',left:1500,run:false});setTab('focus')};
 const resched=()=>{setBusy(true);API.reschedule({tasks:st.tasks,today,last}).then(r=>{setBusy(false);set({tasks:r.tasks});say(r.moved?`Kadam AI spread ${r.moved} tasks over ${r.days} day${r.days>1?'s':''} ✨`:'Nothing left to move')})};
 const send=text=>{set(s=>({chat:[...s.chat,{r:'me',t:text}]}));setTyping(true);
  API.chat({text,goal:st.goal,task:ft?ft.title:'your next task',milestone:wk.title,streak,hist:st.chat.slice(-6)}).then(a=>{setTyping(false);set(s=>({chat:[...s.chat,{r:'ai',t:a}]}))})};
 const reset=()=>{setSt({...INIT,theme:st.theme});setTab('home');setTm({mode:'focus',left:1500,run:false})};
 const X={st,set,say,tl,dn,streak,today,total,wk,toggle,busy,resched,startFocus,done:st.tasks.filter(t=>t.done).length,reset};

 return <div className="mx-auto min-h-screen max-w-lg">
  <header className="sticky z-30 flex items-center justify-between bg-slate-50/85 px-4 py-3 backdrop-blur dark:bg-[#0b1020]/85" style={{top:'env(safe-area-inset-top,0px)'}}>
   <div className="flex items-center gap-2"><div className="grid h-8 w-8 place-items-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 text-white"><I n="spark" s={16}/></div><span className="text-lg font-bold">Kadam AI</span></div>
   <button aria-label="Toggle theme" onClick={()=>set({theme:st.theme==='dark'?'light':'dark'})} className="grid h-9 w-9 place-items-center rounded-full bg-slate-500/10"><I n={st.theme==='dark'?'sun':'moon'} s={18}/></button>
  </header>
  <main className="px-4 pb-36 pt-2">
   {tab==='home'&&<Dash {...X}/>}
   {tab==='road'&&<Road {...X}/>}
   {tab==='focus'&&<Focus {...X} ft={ft} setFid={setFid} tm={tm} setTm={setTm} amb={amb} setAmb={setAmb}/>}
   {tab==='pod'&&<Pod {...X}/>}
   {tab==='me'&&<Me {...X}/>}
  </main>
  <div className="pointer-events-none fixed inset-x-0 z-40" style={{bottom:'calc(env(safe-area-inset-bottom,0px) + 76px)'}}>
   {toast&&<div className="mx-auto mb-3 w-fit max-w-[90%] rounded-full bg-slate-900 px-4 py-2 text-center text-xs font-medium text-white shadow-lg dark:bg-slate-100 dark:text-slate-900">{toast}</div>}
   <div className="mx-auto flex max-w-lg justify-end px-4"><button aria-label="Open AI mentor" onClick={()=>setChat(true)} className="pointer-events-auto grid h-13 w-13 place-items-center rounded-full bg-gradient-to-br from-indigo-500 to-violet-500 text-white shadow-lg shadow-violet-500/40" style={{width:52,height:52}}><I n="spark" s={24}/></button></div>
  </div>
  <nav className="fixed inset-x-0 bottom-0 z-40 border-t border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90" style={{paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
   <div className="mx-auto flex max-w-lg">{TABS.map(([k,l,ic])=><button key={k} onClick={()=>setTab(k)} className={'flex flex-1 flex-col items-center gap-0.5 py-2.5 text-[10px] font-medium '+(tab===k?'text-indigo-500':'text-slate-400')}><I n={ic}/>{l}</button>)}</div>
  </nav>
  <Chat open={chat} onClose={()=>setChat(false)} msgs={st.chat} send={send} typing={typing}/>
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
